name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Unit tests and replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install ".[test]"
      - run: pytest -m "not lean"
      - run: claimcert demo
      - run: claimcert replay examples
      - run: claimcert replay evals

  lean:
    name: Kernel re-run of every claim
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install ".[test]"
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download the Mathlib build cache
        working-directory: lean
        run: lake exe cache get
      - name: Restore the LeanCert build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: lean/.lake/packages/leancert/.lake/build
          key: leancert-${{ runner.os }}-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain') }}
      - name: Build the Lean libraries
        working-directory: lean
        run: lake build ClaimCert ClaimCertTest ClaimCertExamples ClaimCertBench ClaimCertTranslation claimcert-verify
      - run: claimcert doctor
      - run: pytest -m lean
      # A FAIL verdict exits 1, and some claims must fail, so the loops do not stop on it. The last
      # step compares every re-run verdict with the status its name or expected.json fixes.
      - name: Re-run every example through the kernel
        run: |
          for claim in examples/*/*.yaml; do
            claimcert check "$claim" || true
          done
      - name: Re-run the planted-error benchmark
        run: python evals/run_planted.py
      - name: Re-run the translation set through the kernel
        run: |
          for claim in evals/translation/*.yaml; do
            [ "$(basename "$claim")" = registry.yaml ] || claimcert check "$claim" || true
          done
      - name: The re-run must agree with the committed results
        run: pytest tests/test_examples.py

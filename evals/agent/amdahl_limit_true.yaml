name: amdahl_limit_true
type: bound
intent: A job with a 5% or larger serial fraction never speeds up more than 20 times,
  however many workers it gets.
variables:
  S:
    unit: '1'
    domain: real
  f:
    unit: '1'
    domain:
    - '0.05'
    - '1'
  n:
    unit: '1'
    domain: positive
assumptions:
  amdahl:
  - S
  - f
  - n
constants:
  C: '20'
goals:
- S <= C

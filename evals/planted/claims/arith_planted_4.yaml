name: arith_planted_4
type: floor
intent: 'planted: floor 5 % above the true 4-decade value'
variables:
  n:
    unit: m^-3
    domain: positive
  s:
    unit: m^2
    domain: positive
assumptions:
  bm_max_density:
  - n
  bm_max_sigma:
  - s
constants:
  F: 19.35 cm
goals:
- 4 * log(10) / (n * s) >= F

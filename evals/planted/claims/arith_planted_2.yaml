name: arith_planted_2
type: floor
intent: 'planted: floor 5 % above the true 2-decade value'
variables:
  n:
    unit: m^-3
    domain: positive
  s:
    unit: m^2
    domain: positive
assumptions:
  bm_max_density:
  - n
  bm_max_sigma:
  - s
constants:
  F: 9.68 cm
goals:
- 2 * log(10) / (n * s) >= F
